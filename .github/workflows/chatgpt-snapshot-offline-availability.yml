name: Snapshot offline availability

on:
  push:
    branches:
      - chatgpt/snapshot-offline-availability

permissions:
  contents: write

jobs:
  patch-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch on exact main
        shell: bash
        run: |
          set -euo pipefail
          expected='c162c0e525eee1c0bff1ccd29b5e9ed47f02dfeb'
          cp .github/scripts/patch-snapshot-offline-availability.py /tmp/patch-snapshot-offline-availability.py
          git fetch origin main
          git checkout --detach origin/main
          test "$(git rev-parse HEAD)" = "$expected"
          python3 /tmp/patch-snapshot-offline-availability.py
          git diff --check
          actual="$(git status --porcelain | sed -E 's/^.. //' | sort)"
          expected_files="$(printf '%s\n' \
            server/utils/control-escolar-external-snapshot-presenter.ts \
            server/utils/control-escolar-external-snapshot.ts \
            server/utils/control-escolar-external-view.ts | sort)"
          test "$actual" = "$expected_files"
          ! grep -q 'warmExternalControlEscolarStudentScope' server/utils/control-escolar-external-snapshot.ts
          grep -q 'stale/expired timestamps describe freshness, never' server/utils/control-escolar-external-snapshot.ts
          grep -q 'Aurora conservará el último snapshot válido' server/utils/control-escolar-external-view.ts
          grep -q "persistedFallback = freshness === 'stale' || freshness === 'expired'" server/utils/control-escolar-external-snapshot-presenter.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify academic source
        run: npm run verify:academic-source

      - name: Production build
        run: npm run build

      - name: Publish one commit to main
        shell: bash
        run: |
          set -euo pipefail
          expected='c162c0e525eee1c0bff1ccd29b5e9ed47f02dfeb'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            server/utils/control-escolar-external-snapshot-presenter.ts \
            server/utils/control-escolar-external-snapshot.ts \
            server/utils/control-escolar-external-view.ts
          git diff --cached --check
          changed="$(git diff --cached --name-only | sort)"
          expected_files="$(printf '%s\n' \
            server/utils/control-escolar-external-snapshot-presenter.ts \
            server/utils/control-escolar-external-snapshot.ts \
            server/utils/control-escolar-external-view.ts | sort)"
          test "$changed" = "$expected_files"
          git commit -m 'Preserva snapshot canónico sin bridge'
          git push origin HEAD:main
