name: Aurora summary live proof

on:
  push:
    branches:
      - chatgpt/aurora-summary-live-proof-20260921

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AURORA_API_TOKEN: ${{ secrets.AURORA_API_TOKEN }}
      AURORA_BASE_URL: https://aurora.casitaiedis.edu.mx/api/external/v1/talleres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require configured Aurora token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AURORA_API_TOKEN" || { echo "::error::AURORA_API_TOKEN is missing"; exit 1; }
      - name: Prove live /alumnos summary contract
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.AURORA_BASE_URL
          const headers = { Accept: 'application/json', 'x-aurora-token': process.env.AURORA_API_TOKEN }
          const planteles = ['PM','PT','SM','ST','PREEM','CT','GM','CO','DC']
          const norm = (v) => String(v || '').trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z0-9]+/g, '_').replace(/^_+|_+$/g, '')
          const results = {}
          const failures = []
          for (const plantel of planteles) {
            const response = await fetch(base + '/summary?plantel=' + encodeURIComponent(plantel), { headers, signal: AbortSignal.timeout(120000) })
            const text = await response.text()
            let payload = {}
            try { payload = JSON.parse(text) } catch {}
            console.log('response', plantel, 'status=' + response.status, 'type=' + (response.headers.get('content-type') || ''), 'keys=' + Object.keys(payload || {}).join(','), 'prefix=' + text.slice(0, 120).replace(/\s+/g, ' '))
            if (!response.ok || payload?.ok !== true || String(payload?.plantel || '').toUpperCase() !== plantel) {
              console.error('SUMMARY_HTTP_FAIL', plantel, response.status, payload?.data?.code || payload?.statusMessage || '', 'payloadOk=' + payload?.ok, 'payloadPlantel=' + payload?.plantel)
              failures.push({ plantel, status: response.status, code: payload?.data?.code || payload?.statusMessage || '' })
              continue
            }
            const talleres = Array.isArray(payload?.talleres) ? payload.talleres : []
            const map = {}
            for (const row of talleres) {
              const key = norm(row?.clave || row?.nombre)
              const students = Array.isArray(row?.students) ? row.students : []
              const unique = new Set(students.map(s => String(s?.matricula || '').trim().toUpperCase()).filter(Boolean))
              if (!key || unique.size !== Number(row?.alumnos || 0)) {
                console.error('SUMMARY_DETAIL_MISMATCH', plantel, key, row?.alumnos, unique.size)
                process.exit(1)
              }
              map[key] = unique.size
            }
            if (Number(payload?.totals?.talleres || 0) !== talleres.length) {
              console.error('SUMMARY_TOTAL_MISMATCH', plantel, payload?.totals?.talleres, talleres.length)
              process.exit(1)
            }
            results[plantel] = map
            console.log('summary', plantel, 'talleres=' + talleres.length, 'keys=' + Object.entries(map).map(([key,count]) => key + ':' + count).join(','))
          }
          console.log('SM R6=', results.SM?.TRANSPORTE_SENCILLO_R6 || 0)
          console.log('PM BE_AN_ARTIST=', results.PM?.BE_AN_ARTIST || 0)
          if ((results.SM?.TRANSPORTE_SENCILLO_R6 || 0) < 1) failures.push({ marker: 'SM:TRANSPORTE_SENCILLO_R6' })
          if ((results.PM?.BE_AN_ARTIST || 0) < 1) failures.push({ marker: 'PM:BE_AN_ARTIST' })
          if (failures.length) { console.error('LIVE_FAILURES', JSON.stringify(failures)); process.exit(1) }
          console.log('AURORA_ALUMNOS_SUMMARY_LIVE_OK')
          NODE
