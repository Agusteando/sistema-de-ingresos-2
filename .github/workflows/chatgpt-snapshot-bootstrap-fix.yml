name: Snapshot bootstrap fix

on:
  push:
    branches:
      - chatgpt/snapshot-bootstrap-fix

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify academic source
        run: npm run verify:academic-source
      - name: Production build
        run: npm run build
