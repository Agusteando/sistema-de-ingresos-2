name: Talleres report services regression

on:
  push:
    branches:
      - main
      - 'chatgpt/talleres-**'
    paths:
      - 'server/utils/talleres-admin-summary.ts'
      - 'server/utils/talleres-catalog-authority.ts'
      - 'server/utils/talleres-snapshot.ts'
      - 'server/utils/talleres-report.ts'
      - 'server/utils/talleres-contracts.ts'
      - 'server/utils/talleres-servicios.ts'
      - 'server/api/students/[matricula]/servicios/index.get.ts'
      - 'server/api/students/[matricula]/servicios/index.put.ts'
      - 'components/StudentDetails.vue'
      - 'scripts/verify-pt1271-financial-live.mjs'
      - 'server/api/students/[matricula]/servicios/index.get.ts'
      - 'server/api/students/[matricula]/servicios/index.put.ts'
      - 'components/StudentDetails.vue'
      - 'scripts/verify-pt1271-financial-live.mjs'
      - 'server/api/external/v1/talleres/roster.get.ts'
      - 'server/api/external/v1/talleres/summary.get.ts'
      - 'server/api/talleres-servicios/reporte.get.ts'
      - 'server/api/talleres-servicios/reporte-institucional-excel.get.ts'
      - 'server/api/documentos/index.post.ts'
      - 'server/api/documentos/[id].delete.ts'
      - 'server/api/documentos/[id]/concepto.put.ts'
      - 'server/api/documentos/period.post.ts'
      - 'shared/utils/talleresServicios.ts'
      - 'tests/talleres-report-services.test.mjs'
      - 'tests/talleres-report-snapshot-parity.test.mjs'
      - 'tests/talleres-financial-change-regression.test.mjs'
      - 'tests/talleres-summary-membership.test.mjs'
      - '.github/workflows/talleres-report-services-regression.yml'
  pull_request:
    paths:
      - 'server/utils/talleres-admin-summary.ts'
      - 'server/utils/talleres-catalog-authority.ts'
      - 'server/utils/talleres-snapshot.ts'
      - 'server/utils/talleres-report.ts'
      - 'server/utils/talleres-contracts.ts'
      - 'server/utils/talleres-servicios.ts'
      - 'server/api/external/v1/talleres/roster.get.ts'
      - 'server/api/external/v1/talleres/summary.get.ts'
      - 'server/api/talleres-servicios/reporte.get.ts'
      - 'server/api/talleres-servicios/reporte-institucional-excel.get.ts'
      - 'server/api/documentos/index.post.ts'
      - 'server/api/documentos/[id].delete.ts'
      - 'server/api/documentos/[id]/concepto.put.ts'
      - 'server/api/documentos/period.post.ts'
      - 'shared/utils/talleresServicios.ts'
      - 'tests/talleres-report-services.test.mjs'
      - 'tests/talleres-report-snapshot-parity.test.mjs'
      - 'tests/talleres-financial-change-regression.test.mjs'
      - 'tests/talleres-summary-membership.test.mjs'
      - '.github/workflows/talleres-report-services-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  talleres-report-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Verify Talleres roster/report parity
        run: node --experimental-vm-modules --test tests/talleres-report-services.test.mjs tests/talleres-report-snapshot-parity.test.mjs tests/talleres-financial-change-regression.test.mjs tests/talleres-summary-membership.test.mjs
      - name: Verify academic source
        run: npm run verify:academic-source
      - name: Build
        run: npm run build
      - name: Verify PT1271 financial Talleres parity in deployed Aurora
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AURORA_API_TOKEN: ${{ secrets.AURORA_API_TOKEN }}
          AURORA_TEST_CYCLE: '2026'
        run: node scripts/verify-pt1271-financial-live.mjs
