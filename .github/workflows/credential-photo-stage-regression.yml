name: Credential photo stage regression

on:
  pull_request:
    paths:
      - 'server/api/external/v1/control-escolar/credential-photos.get.ts'
      - 'server/utils/control-escolar-credential-photo-stages.ts'
      - 'scripts/verify-credential-photo-stage-scope.mjs'
      - 'package.json'
      - '.github/workflows/credential-photo-stage-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AURORA_API_TOKEN: ${{ secrets.AURORA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Verify explicit stage contract
        run: npm run verify:credential-photo-stage
      - name: Verify academic source contract
        run: npm run verify:academic-source
      - name: Build
        run: npm run build
      - name: Verify live Aurora consumer contracts
        run: |
          if [ -z "$AURORA_API_TOKEN" ]; then
            echo "AURORA_API_TOKEN is required for production contract verification."
            exit 3
          fi
          node scripts/probe-aurora-live.mjs
