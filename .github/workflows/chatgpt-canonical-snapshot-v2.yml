name: Canonical Control Escolar snapshots v2

on:
  push:
    branches:
      - chatgpt/canonical-snapshot-v2

permissions:
  contents: write

jobs:
  patch-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch on exact main
        shell: bash
        run: |
          set -euo pipefail
          expected='574693d5b39e803fa39eb7d9521cfa0848b30a4b'
          cp .github/scripts/patch-canonical-snapshot-v2.py /tmp/patch-canonical-snapshot-v2.py
          git fetch origin main
          git checkout --detach origin/main
          test "$(git rev-parse HEAD)" = "$expected"
          python3 /tmp/patch-canonical-snapshot-v2.py
          if grep -R "writeControlEscolarExternalStudentView" -n server --exclude='control-escolar-external-view.ts' --exclude='control-escolar-external-snapshot.ts'; then
            echo 'Unexpected snapshot writer caller found' >&2
            exit 1
          fi
          git diff --check
          actual="$(git status --porcelain | sed -E 's/^.. //' | sort)"
          expected_files="$(printf '%s\n' scripts/verify-academic-source.mjs server/utils/control-escolar.ts server/utils/control-escolar-external-view.ts server/utils/control-escolar-external-snapshot.ts server/utils/control-escolar-external-snapshot-presenter.ts | sort)"
          test "$actual" = "$expected_files"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify academic source
        run: npm run verify:academic-source

      - name: Production build
        run: npm run build

      - name: Publish one commit to main
        shell: bash
        run: |
          set -euo pipefail
          expected='574693d5b39e803fa39eb7d9521cfa0848b30a4b'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-academic-source.mjs server/utils/control-escolar.ts server/utils/control-escolar-external-view.ts server/utils/control-escolar-external-snapshot.ts server/utils/control-escolar-external-snapshot-presenter.ts
          git diff --cached --check
          git commit -m 'Genera snapshots desde Control Escolar canónico'
          git push origin HEAD:main
