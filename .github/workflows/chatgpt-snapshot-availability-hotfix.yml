name: Validate snapshot availability hotfix

on:
  push:
    branches:
      - chatgpt/snapshot-availability-hotfix

permissions:
  contents: write

jobs:
  validate-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/snapshot-availability-hotfix
          fetch-depth: 0

      - name: Preserve patch script and reset to exact main
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/chatgpt-snapshot-availability-hotfix.py /tmp/snapshot-hotfix.py
          git fetch origin main
          test "$(git rev-parse origin/main)" = "8bd317429ae692506deddb856035e2d112fde9d8"
          git checkout --detach origin/main

      - name: Apply hotfix
        run: python /tmp/snapshot-hotfix.py

      - name: Structural guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q "EXTERNAL_CONTROL_ESCOLAR_COMPATIBLE_VIEW_VERSIONS" server/utils/control-escolar-external-view.ts
          grep -q "mysqlSecondPrecisionNow" server/utils/control-escolar-external-view.ts
          grep -q "view_version IN" server/utils/control-escolar-external-snapshot.ts
          grep -q "Consumer reads are snapshot-only" server/utils/control-escolar-external-snapshot.ts
          ! grep -A30 "assertExternalControlEscolarSnapshotReady" server/utils/control-escolar-external-snapshot.ts | grep -q "warmExternalControlEscolarStudentScope"
          grep -q "persistent-compatible-snapshot" server/utils/control-escolar-external-snapshot-presenter.ts
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "server/utils/control-escolar-external-snapshot-presenter.ts server/utils/control-escolar-external-snapshot.ts server/utils/control-escolar-external-view.ts "

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Verify academic source
        run: npm run verify:academic-source

      - name: Build
        run: npm run build

      - name: Guard main and push one commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "8bd317429ae692506deddb856035e2d112fde9d8"
          git config user.name "Alejandro Jurado"
          git config user.email "desarrollo.tecnologico@casitaiedis.edu.mx"
          git add server/utils/control-escolar-external-view.ts server/utils/control-escolar-external-snapshot.ts server/utils/control-escolar-external-snapshot-presenter.ts
          git commit -m "Restaura disponibilidad permanente de snapshots"
          test "$(git diff --name-only HEAD^ HEAD | sort | tr '\n' ' ')" = "server/utils/control-escolar-external-snapshot-presenter.ts server/utils/control-escolar-external-snapshot.ts server/utils/control-escolar-external-view.ts "
          git push origin HEAD:main
