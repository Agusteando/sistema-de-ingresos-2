name: PM1152 encrypted financial incident evidence
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/pm1152-financial-incident.yml', 'server/api/external/v1/incidents/pm1152.get.ts', 'tests/pm1152-incident-read.test.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --experimental-vm-modules --test tests/pm1152-incident-read.test.mjs
      - run: npm run build
  live-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read PM1152 full production ledger and encrypt evidence
        env:
          AURORA_API_TOKEN: ${{ secrets.AURORA_API_TOKEN }}
          AUDIT_PUBLIC_KEY: 
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { randomBytes, createCipheriv, publicEncrypt, constants } from 'node:crypto';
          if (!process.env.AURORA_API_TOKEN) throw new Error('AURORA_API_TOKEN missing');
          const headers = { Accept: 'application/json', 'x-aurora-token': process.env.AURORA_API_TOKEN };
          let response, body;
          for (let attempt=1; attempt<=18; attempt++) {
            response=await fetch('https://aurora.casitaiedis.edu.mx/api/external/v1/incidents/pm1152', {headers, signal: AbortSignal.timeout(120000)});
            body=await response.json().catch(()=>({}));
            if (response.ok && body.version==='pm1152-ledger-v1') break;
            if (![404,502,503,504].includes(response.status)) break;
            console.log('PM1152_DEPLOYMENT_WAIT='+attempt+' HTTP '+response.status);
            await new Promise(resolve=>setTimeout(resolve,15000));
          }
          const payload = { status: response.status, requestId: response.headers.get('x-aurora-request-id'), receivedAt: new Date().toISOString(), body };
          const key=randomBytes(32), iv=randomBytes(12), cipher=createCipheriv('aes-256-gcm',key,iv);
          const ciphertext=Buffer.concat([cipher.update(JSON.stringify(payload)),cipher.final()]);
          const encryptedKey=publicEncrypt({key:Buffer.from(process.env.AUDIT_PUBLIC_KEY,'base64'),padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key);
          const envelope=Buffer.from(JSON.stringify({key:encryptedKey.toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:ciphertext.toString('base64')})).toString('base64');
          for(let offset=0,index=0;offset<envelope.length;offset+=6000,index++) console.log('PM1152_ENCRYPTED_'+index+'='+envelope.slice(offset,offset+6000));
          console.log('PM1152_PRODUCTION_HTTP_STATUS='+response.status);
          if (!response.ok || body.ok===false) throw new Error('PM1152 raw incident ledger query failed; details are encrypted above');
          console.log('PM1152_PRODUCTION_READ_OK');
          JS
