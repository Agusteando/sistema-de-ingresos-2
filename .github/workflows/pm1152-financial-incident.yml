name: PM1152 financial incident prevention and reconciliation
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/pm1152-financial-incident.yml', 'components/DocumentModal.vue', 'components/ConceptChangeModal.vue', 'components/StudentDetails.vue', 'server/api/documentos/**', 'server/api/students/**/debts.get.ts', 'server/api/external/v1/incidents/**', 'server/utils/document-creation.ts', 'server/utils/financial-write-followup.ts', 'server/utils/pm1152-reconciliation.ts', 'shared/utils/debtSettlement.ts', 'tests/document-creation-incident.test.mjs', 'tests/pm1152-incident-read.test.mjs', 'scripts/pm1152-incident.mjs']
  push:
    branches: [main]
    paths: ['server/api/external/v1/incidents/pm1152/reconcile.post.ts', 'server/utils/pm1152-reconciliation.ts']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pm1152-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contract-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
          MYSQL_DATABASE: financial_fixture
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-only" --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Real MySQL concurrency, rollback, scoped reconciliation and financial regressions
        run: node --experimental-vm-modules --test tests/document-creation-incident.test.mjs tests/pm1152-incident-read.test.mjs tests/talleres-financial-change-regression.test.mjs tests/concept-eventual-flag.test.mjs
        env:
          MYSQL_TEST_URL: mysql://root:fixture-only@127.0.0.1:3306/financial_fixture
      - run: npm run build
  live-evidence:
    needs: contract-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read production source; reconcile only after main deployment
        env:
          AURORA_API_TOKEN: ${{ secrets.AURORA_API_TOKEN }}
          INCIDENT_MODE: ${{ github.event_name == 'push' && 'apply' || 'read' }}
          AUDIT_PUBLIC_KEY: 
        run: node scripts/pm1152-incident.mjs
