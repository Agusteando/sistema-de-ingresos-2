name: DX targeted consumer probe

on:
  push:
    branches:
      - chatgpt/dx-live-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe PT and PR through Scanner without logging identifiers
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, sys
          BASE='https://escaner.casitaapps.com'

          def get(path):
              req=urllib.request.Request(BASE+path,headers={'Accept':'application/json','User-Agent':'Aurora-DX-Targeted-Probe/1.0'})
              with urllib.request.urlopen(req,timeout=90) as r:
                  return r.status,json.loads(r.read().decode())

          def post(path,body):
              req=urllib.request.Request(BASE+path,data=json.dumps(body).encode(),method='POST',headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':'Aurora-DX-Targeted-Probe/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=90) as r:
                      return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  raw=e.read()
                  try:data=json.loads(raw.decode())
                  except Exception:data={}
                  return e.code,data

          status,identities=get('/api/preload-identities')
          items=identities.get('items') if isinstance(identities,dict) else []
          items=items if isinstance(items,list) else []
          print('identities_http',status,'rows',len(items))
          failed=False
          for plantel in ['PT','PR']:
              candidate=next((x for x in items if str((x or {}).get('plantel') or '').upper()==plantel and str((x or {}).get('matricula') or '').strip()),None)
              if not candidate:
                  print(plantel,'no_candidate')
                  continue
              status,data=post('/api/academic',{'matricula':candidate.get('matricula'),'plantel':plantel})
              payload=data.get('data') if isinstance(data,dict) else None
              has_grado=bool(str((payload or {}).get('grado') or '').strip())
              has_grupo=bool(str((payload or {}).get('grupo') or (payload or {}).get('group') or '').strip())
              source=str((payload or {}).get('source') or '')
              print(plantel,'HTTP',status,'has_grado',has_grado,'has_grupo',has_grupo,'source',source or '-')
              if plantel=='PT' and (status!=200 or not has_grado or not has_grupo): failed=True
          if failed: sys.exit(2)
          PY
