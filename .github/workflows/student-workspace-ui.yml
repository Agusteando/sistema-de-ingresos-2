name: Student workspace UI regression

on:
  pull_request:
    paths:
      - 'assets/css/**'
      - 'layouts/default.vue'
      - 'components/students/**'
      - 'utils/studentPhotos.js'
      - 'server/api/students/**/photo.get.ts'
      - 'tests/student-photo-source.test.mjs'
      - 'components/StudentDetails.vue'
      - 'components/ui/UiVisionFaceImage.vue'
      - 'pages/control-escolar.vue'
      - 'pages/login.vue'
      - 'pages/__visual-lab/**'
      - 'public/brand/**'
      - 'scripts/verify-student-workspace-ui.mjs'
      - '.github/workflows/student-workspace-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-student-workspaces:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/student-photo-source.test.mjs
      # Keep browser-only tooling isolated: npm Arborist can fail when
      # installing --no-save packages into Nuxt's existing dependency graph.
      - name: Install visual testing tools in an isolated prefix
        run: |
          mkdir -p "$RUNNER_TEMP/aurora-visual-deps"
          npm install --prefix "$RUNNER_TEMP/aurora-visual-deps" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.1 @fontsource/montserrat@5 @fontsource/fredoka@5
      - name: Install Chromium for visual regression
        run: |
          "$RUNNER_TEMP/aurora-visual-deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify financial and Control Escolar layouts, photos and identity
        run: node scripts/verify-student-workspace-ui.mjs
        env:
          VISUAL_EVIDENCE_DIR: ui-evidence
          VISUAL_PLAYWRIGHT_MODULE: ${{ runner.temp }}/aurora-visual-deps/node_modules/playwright
          VISUAL_FONT_MODULES: ${{ runner.temp }}/aurora-visual-deps/node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-workspace-visual-proof
          path: ui-evidence
