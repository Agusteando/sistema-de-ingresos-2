name: Inspect deudores main proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-deudores-main-run.yml'

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 745b040fc34c13667c806cf8b97e916351cef467
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: List workflow runs for merged commit
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=20" \
            --jq '.workflow_runs[] | "RUN id=\(.id) name=\(.name) event=\(.event) status=\(.status) conclusion=\(.conclusion) url=\(.html_url)"'
