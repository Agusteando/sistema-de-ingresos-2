name: Aurora Alpine Trivy trial disposable
on:
  push:
    branches: [security/alpine-container-trivy-20261008]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Alpine Nuxt candidate
        run: docker build --progress=plain -f Containerfile -t aurora-alpine-candidate .
      - name: Verify runtime and Prisma availability
        run: |
          docker run --rm --entrypoint sh aurora-alpine-candidate -ec '
            test -f /app/.output/server/index.mjs
            node --check /app/.output/server/index.mjs
            node -e "
              const {PrismaClient}=require(\"@prisma/client\");
              const db=new PrismaClient();
              if(typeof db.base.findMany!==\"function\")throw Error(\"Generated Prisma model unavailable\");
              const fs=require(\"node:fs\");
              const lib=fs.readdirSync(\"node_modules/.prisma/client\").filter(x=>x.includes(\"linux-musl\")&&x.endsWith(\".node\"));
              if(!lib.length)throw Error(\"Missing Alpine Prisma native engine\");
              console.log(\"AURORA_PRISMA_MUSL=PASS\",lib);
              db.\$disconnect();
            "
            echo AURORA_NITRO_BUNDLE=PASS
          '
          docker run -d --name aurora-alpine-offline --network none \
            -e DB_TRANSPORT=bridge -e DB_BRIDGE_URL=http://127.0.0.1:8787 \
            aurora-alpine-candidate
          docker exec aurora-alpine-offline node -e '
            (async()=>{
              for(let n=0;n<50;n++){
                try{
                  const r=await fetch("http://127.0.0.1:3000/",{redirect:"manual"});
                  if(r.status>=500||r.status===404)throw Error("Aurora root HTTP "+r.status);
                  console.log("AURORA_HTTP=PASS",r.status);
                  process.exit(0);
                }catch(e){if(n===49)throw e;await new Promise(done=>setTimeout(done,500))}
              }
            })().catch(e=>{console.error(e);process.exit(1)});
          '
          docker rm -f aurora-alpine-offline
      - name: Trivy scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" aquasec/trivy:0.74.0 image \
            --image-src docker --scanners vuln --severity CRITICAL,HIGH \
            --format json --output /work/aurora-trivy.json aurora-alpine-candidate
      - name: Report
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          data=json.load(open("aurora-trivy.json"))
          vs=[v for r in data.get("Results",[]) for v in (r.get("Vulnerabilities") or [])]
          c=Counter(v.get("Severity") for v in vs)
          print("AURORA_OS",data.get("Metadata",{}).get("OS"))
          print(f"AURORA_TRIVY C={c['CRITICAL']} H={c['HIGH']} C+H={len(vs)} fixable={sum(bool(x.get('FixedVersion')) for x in vs)}")
          if data.get("Metadata",{}).get("OS",{}).get("Family")!="alpine":raise SystemExit("Alpine OS not inventoried")
          PY
