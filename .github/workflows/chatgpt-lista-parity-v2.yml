          allowed="$(printf '%s\n' components/DxProofPanel.vue pages/dx/api-lab.vue scripts/verify-academic-source.mjs scripts/verify-dx-api-lab.mjs server/api/control-escolar/dx-api-lab/proof.post.ts server/utils/control-escolar-external-canonical-scope.ts server/utils/control-escolar-external-snapshot-refresh.ts server/utils/control-escolar-external-view.ts server/utils/control-escolar.ts | sort)"
