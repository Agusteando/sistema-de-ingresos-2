name: Concept eventual flag regression

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
    paths:
      - 'shared/utils/conceptEventual.ts'
      - 'shared/utils/documentMonths.ts'
      - 'server/utils/financial-concept.ts'
      - 'server/utils/conceptos-config.ts'
      - 'server/api/conceptos/**'
      - 'server/api/external/v1/conceptos/**'
      - 'server/api/documentos/index.post.ts'
      - 'components/DocumentModal.vue'
      - 'components/ConceptSearchSelect.vue'
      - 'components/ConceptMultiSearchSelect.vue'
      - 'tests/concept-eventual-flag.test.mjs'
      - '.github/workflows/concept-eventual-flag-regression.yml'
  pull_request:
    paths:
      - 'shared/utils/conceptEventual.ts'
      - 'shared/utils/documentMonths.ts'
      - 'server/utils/financial-concept.ts'
      - 'server/utils/conceptos-config.ts'
      - 'server/api/conceptos/**'
      - 'server/api/external/v1/conceptos/**'
      - 'server/api/documentos/index.post.ts'
      - 'components/DocumentModal.vue'
      - 'components/ConceptSearchSelect.vue'
      - 'components/ConceptMultiSearchSelect.vue'
      - 'tests/concept-eventual-flag.test.mjs'
      - '.github/workflows/concept-eventual-flag-regression.yml'

permissions:
  contents: read

jobs:
  concept-eventual-flag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Verify eventual 0/1 contract
        run: node --experimental-vm-modules --test tests/concept-eventual-flag.test.mjs
      - name: Build
        run: npm run build
