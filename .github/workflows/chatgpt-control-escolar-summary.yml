name: Control Escolar summary patch

on:
  push:
    branches: ["chatgpt/control-escolar-resumen"]

permissions:
  contents: write

jobs:
  patch-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar parche sobre main exacto
        shell: bash
        run: |
          set -euo pipefail
          expected='b1b50eac90f8ff45f01b81f0e84a9c2b6930fe35'
          cp .github/scripts/patch-control-escolar-summary.py /tmp/patch-control-escolar-summary.py
          git fetch origin main
          git checkout --detach origin/main
          current="$(git rev-parse HEAD)"
          if [ "$current" != "$expected" ]; then
            echo "main cambió: esperado $expected, actual $current" >&2
            exit 1
          fi
          python3 /tmp/patch-control-escolar-summary.py
          changed="$(git diff --name-only)"
          if [ "$changed" != 'pages/control-escolar.vue' ]; then
            echo "Cambio inesperado: $changed" >&2
            exit 1
          fi
          git diff --check

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producción
        run: npm run build

      - name: Publicar un único commit en main
        shell: bash
        run: |
          set -euo pipefail
          expected='b1b50eac90f8ff45f01b81f0e84a9c2b6930fe35'
          git fetch origin main
          remote="$(git rev-parse origin/main)"
          if [ "$remote" != "$expected" ]; then
            echo "main cambió durante la verificación: esperado $expected, remoto $remote" >&2
            exit 1
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/control-escolar.vue
          git commit -m 'Restaura resumen de matrícula en Control Escolar'
          git push origin HEAD:main
