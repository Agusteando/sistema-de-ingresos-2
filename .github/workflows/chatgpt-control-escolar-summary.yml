name: Restaurar resumen Control Escolar

on:
  push:
    branches:
      - chatgpt/control-escolar-resumen

permissions:
  contents: write

jobs:
  patch-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main exacto
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verificar base remota
        shell: bash
        run: |
          set -euo pipefail
          expected='b1b50eac90f8ff45f01b81f0e84a9c2b6930fe35'
          current="$(git rev-parse HEAD)"
          if [ "$current" != "$expected" ]; then
            echo "main cambió: esperado $expected, actual $current" >&2
            exit 1
          fi

      - name: Aplicar integración mínima
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('pages/control-escolar.vue')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: se esperaba 1 coincidencia, se encontraron {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'import StudentsKpiValue from "~/components/students/StudentsKpiValue.vue";\nimport ControlEscolarSelectionDock from "~/components/students/ControlEscolarSelectionDock.vue";',
              'import StudentsKpiValue from "~/components/students/StudentsKpiValue.vue";\nimport StudentsEnrollmentSummary from "~/components/students/StudentsEnrollmentSummary.vue";\nimport ControlEscolarSelectionDock from "~/components/students/ControlEscolarSelectionDock.vue";',
              'import del resumen',
          )

          replace_once(
              'import { normalizeCicloKey, formatCicloLabel } from "~/shared/utils/ciclo";\nimport { DEFAULT_TALLER_SERVICIO_IMAGE, normalizeServicioClave, parseServiciosCsv } from "~/shared/utils/talleresServicios";',
              'import { normalizeCicloKey, formatCicloLabel } from "~/shared/utils/ciclo";\nimport { buildEnrollmentSummary } from "~/shared/utils/enrollmentSummary";\nimport { DEFAULT_TALLER_SERVICIO_IMAGE, normalizeServicioClave, parseServiciosCsv } from "~/shared/utils/talleresServicios";',
              'import del builder',
          )

          replace_once(
              "            {\n              'has-detail': Boolean(selectedStudent),\n              'is-browsing': !selectedStudent,\n            },",
              "            {\n              'has-detail': Boolean(selectedStudent),\n              'has-empty-detail': showControlEnrollmentSummary,\n              'is-browsing': !selectedStudent && !showControlEnrollmentSummary,\n            },",
              'estado del workspace',
          )

          replace_once(
              "              'student-list-panel',\n              selectedStudent ? 'is-compact' : 'is-full',",
              "              'student-list-panel',\n              selectedStudent || showControlEnrollmentSummary ? 'is-compact' : 'is-full',",
              'modo del panel de alumnos',
          )

          replace_once(
              "                  'list-columns ce-list-columns',\n                  selectedStudent ? 'compact' : 'full',",
              "                  'list-columns ce-list-columns',\n                  selectedStudent || showControlEnrollmentSummary ? 'compact' : 'full',",
              'modo de columnas',
          )

          summary_markup = '''      </section>\n\n      <StudentsEnrollmentSummary\n        v-else-if="showControlEnrollmentSummary"\n        class="ce-enrollment-summary"\n        :summary="controlEnrollmentSummary"\n        :plantel-label="selectedAgentId"\n        :ciclo-label="currentCicloLabel"\n        :active-grade="filters.grado"\n        :active-group="filters.group"\n        :loading="studentsLoading"\n        :unavailable="controlEnrollmentSummaryUnavailable"\n        @select-grade="selectSummaryGrade"\n        @select-group="selectSummaryGroup"\n        @clear="clearAcademicFilters"\n      />\n    </div>\n\n    <ControlEscolarSelectionDock'''
          replace_once(
              '      </section>\n    </div>\n\n    <ControlEscolarSelectionDock',
              summary_markup,
              'panel de resumen',
          )

          summary_logic = '''const controlBulkSelectedCount = computed(() => controlBulkSelection.size);\n\nconst controlEnrollmentSummaryUnavailable = computed(\n  () =>\n    !studentsLoading.value &&\n    (studentsSourceUnavailable.value || controlCompleteStage.value === "failed"),\n);\n\nconst controlEnrollmentSummary = computed(() =>\n  buildEnrollmentSummary(controlStudentsIndex.value, {\n    include: (student) => student?.enrollmentState === "inscrito",\n    type: (student) =>\n      student?.tipoIngresoValue === "interno" ? "interno" : "externo",\n    grade: (student) => student?.grado,\n    group: (student) => student?.group || student?.grupo,\n    matricula: (student) => student?.matricula,\n  }),\n);\n\nconst showControlEnrollmentSummary = computed(\n  () => !selectedStudent.value && controlBulkSelectedCount.value === 0,\n);\n\nconst selectSummaryGrade = (grado) => {\n  selectGrade(grado);\n};\n\nconst selectSummaryGroup = ({ grade, group } = {}) => {\n  const sameSelection = filters.grado === grade && filters.group === group;\n  filters.grado = sameSelection ? "" : String(grade || "");\n  filters.group = sameSelection ? "" : String(group || "");\n  pagination.page = 1;\n};'''
          replace_once(
              'const controlBulkSelectedCount = computed(() => controlBulkSelection.size);',
              summary_logic,
              'lógica del resumen',
          )

          summary_css = r'''

/* Control Escolar: keep the shared enrollment summary in the same workspace lane as /alumnos. */
@media (min-width: 821px) {
  .control-escolar-screen .ce-workspace.has-empty-detail {
    grid-template-rows: auto minmax(0, 1fr);
  }

  .control-escolar-screen .ce-workspace.has-empty-detail > .student-list-panel {
    display: contents;
  }

  .control-escolar-screen .ce-workspace.has-empty-detail > .student-list-panel > .ce-filter-bar {
    grid-column: 1 / -1;
    grid-row: 1;
  }

  .control-escolar-screen .ce-workspace.has-empty-detail > .student-list-panel > .ce-list-card {
    grid-column: 1;
    grid-row: 2;
    min-width: 0;
    min-height: 0;
  }

  .control-escolar-screen .ce-workspace.has-empty-detail > :deep(.ce-enrollment-summary) {
    grid-column: 2;
    grid-row: 2;
    min-width: 0;
    min-height: 0;
  }
}

@media (max-width: 820px) {
  .control-escolar-screen .ce-workspace.has-empty-detail {
    grid-template-rows: minmax(360px, 48vh) minmax(420px, 58vh) !important;
    gap: 10px !important;
    overflow-x: hidden !important;
    overflow-y: auto !important;
    overscroll-behavior-y: contain;
    scrollbar-width: thin;
  }

  .control-escolar-screen .ce-workspace.has-empty-detail > .student-list-panel,
  .control-escolar-screen .ce-workspace.has-empty-detail > :deep(.ce-enrollment-summary) {
    width: 100%;
    min-width: 0 !important;
    height: 100%;
    min-height: 0;
  }
}
'''
          marker = '\n</style>\n'
          if text.count(marker) != 1:
              raise SystemExit(f'cierre style: se esperaba 1 coincidencia, se encontraron {text.count(marker)}')
          text = text.replace(marker, summary_css + marker, 1)

          checks = {
              'componente': 'StudentsEnrollmentSummary',
              'builder': 'buildEnrollmentSummary(controlStudentsIndex.value',
              'selección masiva': 'controlBulkSelectedCount.value === 0',
              'estado vacío': "'has-empty-detail': showControlEnrollmentSummary",
              'browsing excluye resumen': "'is-browsing': !selectedStudent && !showControlEnrollmentSummary",
              'evento grupo': '@select-group="selectSummaryGroup"',
          }
          for label, needle in checks.items():
              if needle not in text:
                  raise SystemExit(f'validación faltante: {label}')

          if text.count('class="ce-enrollment-summary"') != 1:
              raise SystemExit('el resumen debe renderizarse exactamente una vez')
          if text.count('import StudentsEnrollmentSummary from') != 1:
              raise SystemExit('el componente debe importarse exactamente una vez')
          if text.count('import { buildEnrollmentSummary }') != 1:
              raise SystemExit('el builder debe importarse exactamente una vez')

          path.write_text(text, encoding='utf-8')
          PY

          changed="$(git diff --name-only)"
          if [ "$changed" != 'pages/control-escolar.vue' ]; then
            echo "Cambio inesperado: $changed" >&2
            exit 1
          fi
          git diff --check

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producción
        run: npm run build

      - name: Confirmar que main no cambió y publicar
        shell: bash
        run: |
          set -euo pipefail
          expected='b1b50eac90f8ff45f01b81f0e84a9c2b6930fe35'
          git fetch origin main
          remote="$(git rev-parse origin/main)"
          if [ "$remote" != "$expected" ]; then
            echo "main cambió durante la verificación: esperado $expected, remoto $remote" >&2
            exit 1
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/control-escolar.vue
          git commit -m 'Restaura resumen de matrícula en Control Escolar'
          git push origin HEAD:main
