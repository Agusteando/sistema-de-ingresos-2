name: ChatGPT canonical row refresh

on:
  push:
    branches:
      - chatgpt/canonical-row-refresh-hardening

permissions:
  contents: write

jobs:
  validate-and-push:
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: c93d273798cc26111d00cf0564911e35ab3193ac
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve patch script
        run: cp scripts/chatgpt-canonical-row-refresh.py /tmp/canonical-row-refresh.py

      - name: Guard exact main and reset
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git reset --hard origin/main

      - name: Apply patch
        run: python /tmp/canonical-row-refresh.py

      - name: Guard changed files
        run: |
          changed="$(git status --short | awk '{print $2}' | sort)"
          allowed="$(printf '%s\n' scripts/verify-academic-source.mjs server/utils/control-escolar-external-view.ts | sort)"
          test "$changed" = "$allowed"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify academic parity contract
        run: npm run verify:academic-source

      - name: Verify DX proof
        run: node scripts/verify-dx-api-lab.mjs

      - name: Production build
        run: npm run build

      - name: Guard main and push one commit
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-academic-source.mjs server/utils/control-escolar-external-view.ts
          git commit -m "Protege refresh puntual del snapshot canónico"
          git push origin HEAD:main
